# ミニボッチャのコートとボールの設定 (全パッケージ共通)
#
# ROS のノードはパラメータとしてではなく、このファイルを直接読み込む
# (boccia_game, boccia_sim、将来は mujoco/ の学習環境からも読む)。
# 値を変えたら、関係するノードを再起動すること。
#
# 座標系: base_link (CRANE-X7 の根元。x: ロボットの正面、y: 左、z: 上)
# ※ 数値はすべて仮の値。実物のコートを作ったら測って書き換える。

court:
  # コート (長方形) の手前左の角の位置 [m] と、コートの向き [rad] (base_link の x 軸からの角度)
  origin: {x: 0.15, y: -0.25, z: 0.0}
  yaw: 0.0
  # コートの大きさ [m] (length: ロボットから遠ざかる向き、width: 左右)
  length: 0.40
  width: 0.50
  # コート面の高さ [m] (base_link から見た台の上面。ロボットと同じ台なら 0)
  surface_z: 0.0

ball:
  # 実物のミニボッチャのボール (2026-10 に届いたもの): 直径 60 mm、重さ 90 g
  # ジャックボールも同じ大きさとしている (違う場合は jack_diameter を書き換える)
  diameter: 0.060
  jack_diameter: 0.060
  mass: 0.090

# 自分のチームの色 (red / blue)。boccia_game が「自分のボール」を選ぶときに使う
team_color: red

# 1 試合で各チームが持つボールの数 (段階 1 では参考値)
balls_per_team: 3
